name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Javascript Obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate JavaScript files
        run: |
          javascript-obfuscator content/dom.js --output content/dom.js
          javascript-obfuscator content/executor.js --output content/executor.js
          javascript-obfuscator popup/popup.js --output popup/popup.js

      - name: Zip Extension
        run: |
          zip -r extension.zip . -x "*.git*" -x ".github/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: extension.zip
          generate_release_notes: true