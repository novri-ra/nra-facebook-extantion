<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRA Icon Resizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;       /* Dark Slate */
      --bg-panel: #1e293b;       /* Panel Slate */
      --bg-hover: #334155;
      --fg-color: #38bdf8;       /* Soft Cyan */
      --fg-dim: #94a3b8;         /* Slate Gray */
      --fg-highlight: #e2e8f0;   /* Slate Light */
      --accent-blue: #818cf8;    /* Soft Indigo */
      --font-mono: "Share Tech Mono", "Courier New", Courier, monospace;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--fg-highlight);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: var(--bg-panel);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--fg-dim);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: var(--fg-color);
      margin-top: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .drop-zone {
      border: 2px dashed var(--fg-dim);
      border-radius: 8px;
      padding: 3rem 1rem;
      margin: 1.5rem 0;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.5);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--fg-color);
      background: var(--bg-hover);
    }

    .drop-zone p {
      margin: 0;
      color: var(--fg-dim);
      font-size: 1.1rem;
    }

    .drop-zone.has-image {
      padding: 1rem;
      border-style: solid;
      border-color: var(--fg-color);
    }

    #preview-container {
      display: none;
      margin: 1rem 0;
    }

    #preview-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid var(--fg-color);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
    }

    .actions {
      display: none;
      gap: 10px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--bg-color);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: var(--accent-blue);
      color: var(--bg-color);
    }

    button.btn-all {
      background: var(--accent-blue);
      color: var(--bg-color);
      width: 100%;
      margin-top: 10px;
    }

    button.btn-all:hover {
      background: var(--fg-highlight);
      border-color: var(--fg-highlight);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>> ICON_RESIZER.exe</h1>
    
    <input type="file" id="file-input" accept="image/*" hidden>
    
    <div class="drop-zone" id="drop-zone">
      <p id="drop-text">Drag & Drop Image Here<br>or Click to Browse</p>
      <div id="preview-container">
        <img id="preview-img" alt="Preview">
      </div>
    </div>

    <div class="actions" id="actions">
      <button onclick="downloadIcon(16)">16x16</button>
      <button onclick="downloadIcon(48)">48x48</button>
      <button onclick="downloadIcon(128)">128x128</button>
      <button class="btn-all" onclick="downloadAll()">DOWNLOAD ALL (ZIP/AUTO)</button>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const actions = document.getElementById('actions');
    const dropText = document.getElementById('drop-text');

    let currentImage = null;

    // --- Drag & Drop Handlers ---
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    // --- File Processing ---
    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Tolong unggah file gambar yang valid!');
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          previewImg.src = event.target.result;
          
          // Update UI
          dropText.style.display = 'none';
          previewContainer.style.display = 'block';
          dropZone.classList.add('has-image');
          actions.style.display = 'flex';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- High Quality Cropping & Resizing ---
    function resizeIcon(size) {
      if (!currentImage) return null;

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Aktifkan rendering High Quality agar tidak pecah/blur
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // Hitung Center Crop (Pusat Gambar) agar menjadi persegi sempurna
      const { width, height } = currentImage;
      const minDim = Math.min(width, height);
      const startX = (width - minDim) / 2;
      const startY = (height - minDim) / 2;

      // Draw dengan cropping presisi
      ctx.drawImage(
        currentImage,
        startX, startY, minDim, minDim, // Source area (Square Crop)
        0, 0, size, size                // Destination area (Resized)
      );

      return canvas.toDataURL('image/png');
    }

    // --- Download Logic ---
    function downloadIcon(size) {
      const dataUrl = resizeIcon(size);
      if (!dataUrl) return;

      const link = document.createElement('a');
      link.download = \`icon-\${size}.png\`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadAll() {
      if (!currentImage) return;
      // Download beruntun
      downloadIcon(128);
      setTimeout(() => downloadIcon(48), 300);
      setTimeout(() => downloadIcon(16), 600);
    }
  </script>
</body>
</html>
