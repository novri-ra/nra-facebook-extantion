<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRA Icon Resizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --bg-panel: #1e293b;
      --bg-hover: #334155;
      --fg-color: #38bdf8;
      --fg-dim: #94a3b8;
      --fg-highlight: #e2e8f0;
      --accent-blue: #818cf8;
      --danger-color: #fb7185;
      --font-mono: "Share Tech Mono", "Courier New", Courier, monospace;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--fg-highlight);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: var(--bg-panel);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--fg-dim);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 550px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: var(--fg-color);
      margin-top: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    /* Upload Area */
    .drop-zone {
      display: block;
      border: 2px dashed var(--fg-dim);
      border-radius: 8px;
      padding: 2.5rem 1rem;
      margin: 1.5rem 0;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.5);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--fg-color);
      background: var(--bg-hover);
    }

    .drop-zone p {
      margin: 0;
      color: var(--fg-dim);
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* Workspace */
    #workspace {
      display: none;
    }

    .control-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .control-group label {
      display: flex;
      justify-content: space-between;
      color: var(--fg-color);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    /* Retro Slider */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--fg-color);
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 10px var(--fg-color);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: var(--bg-hover);
      border-radius: 2px;
    }
    
    /* Live Preview Grid */
    .preview-grid {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 1.5rem;
      padding: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px solid var(--bg-hover);
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .preview-box canvas {
      background: transparent;
      /* Visual border untuk melihat batas transparan */
      border: 1px dashed rgba(148, 163, 184, 0.3); 
    }

    .preview-box span {
      font-size: 0.8rem;
      color: var(--fg-dim);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: var(--bg-color);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: var(--accent-blue);
      color: var(--bg-color);
    }

    button.btn-all {
      background: var(--accent-blue);
      color: var(--bg-color);
      width: 100%;
    }
    button.btn-all:hover {
      background: var(--fg-highlight);
      border-color: var(--fg-highlight);
    }

    button.btn-reset {
      color: var(--danger-color);
      border-color: var(--danger-color);
      width: 100%;
      margin-top: 10px;
    }
    button.btn-reset:hover {
      background: var(--danger-color);
      color: var(--bg-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>> ICON_RESIZER.exe</h1>
    
    <!-- Area Upload -->
    <label class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <p id="drop-text">Klik di sini untuk Pilih Gambar<br>atau Seret (Drag) File ke Sini</p>
    </label>

    <!-- Area Kerja (Muncul setelah upload) -->
    <div id="workspace">
      
      <!-- Kontrol Padding (Zoom out) -->
      <div class="control-group">
        <label>
          <span>SCALE / PADDING (Transparent)</span>
          <span id="scale-val">100%</span>
        </label>
        <input type="range" id="scale-slider" min="50" max="100" value="100">
      </div>

      <!-- Live Preview ke-3 ukuran -->
      <div class="preview-grid">
        <div class="preview-box">
          <canvas id="cvs-128" width="128" height="128"></canvas>
          <span>128px</span>
        </div>
        <div class="preview-box">
          <canvas id="cvs-48" width="48" height="48"></canvas>
          <span>48px</span>
        </div>
        <div class="preview-box">
          <canvas id="cvs-16" width="16" height="16"></canvas>
          <span>16px</span>
        </div>
      </div>

      <!-- Tombol Eksekusi -->
      <div class="actions">
        <button onclick="downloadIcon(128)">128x128</button>
        <button onclick="downloadIcon(48)">48x48</button>
        <button onclick="downloadIcon(16)">16x16</button>
        <button class="btn-all" onclick="downloadAll()">DOWNLOAD ALL SIZES (ZIP/AUTO)</button>
        <button class="btn-reset" onclick="resetWorkspace()">RESET / GANTI GAMBAR</button>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const workspace = document.getElementById('workspace');
    
    const slider = document.getElementById('scale-slider');
    const scaleValText = document.getElementById('scale-val');
    
    // Canvas contexts
    const cvs128 = document.getElementById('cvs-128');
    const cvs48 = document.getElementById('cvs-48');
    const cvs16 = document.getElementById('cvs-16');

    let currentImage = null;
    let currentScale = 1.0;

    // --- Drag & Drop Events ---
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault(); e.stopPropagation();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // --- File Input Change ---
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    // --- File Processing ---
    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Format file tidak valid! Harap unggah file gambar (PNG/JPG).');
        return;
      }

      const reader = new FileReader();
      reader.onerror = () => { alert('Terjadi kesalahan saat membaca file.'); fileInput.value = ''; };
      
      reader.onload = (event) => {
        const img = new Image();
        img.onerror = () => { alert('Gagal memuat data gambar. File korup.'); fileInput.value = ''; };
        
        img.onload = () => {
          currentImage = img;
          
          // Switch UI
          dropZone.style.display = 'none';
          workspace.style.display = 'block';
          
          // Reset slider
          slider.value = 100;
          currentScale = 1.0;
          scaleValText.innerText = '100%';
          
          // Render Live Previews
          renderAllPreviews();
          
          fileInput.value = ''; // Bebaskan memory input
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- Dynamic Slider ---
    slider.addEventListener('input', (e) => {
      scaleValText.innerText = e.target.value + '%';
      currentScale = parseInt(e.target.value) / 100;
      if (currentImage) renderAllPreviews();
    });

    // --- Core Rendering Engine (Draw to Target Canvas) ---
    function renderToCanvas(canvasElement, img, scale) {
      const ctx = canvasElement.getContext('2d');
      const size = canvasElement.width; // Asumsi persegi (128, 48, 16)
      
      // Bersihkan canvas dari render sebelumnya (transparan)
      ctx.clearRect(0, 0, size, size);

      // Optimasi High Quality
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 1. Center crop kalkulasi (ambil kotak dari tengah gambar asli)
      const { width, height } = img;
      const minDim = Math.min(width, height);
      const startX = (width - minDim) / 2;
      const startY = (height - minDim) / 2;

      // 2. Kalkulasi Padding (Scale)
      // Jika scale = 0.8 (80%), maka ukuran gambar yang digambar ke canvas hanya 80% dari total area.
      // Sisa 20% akan menjadi padding transparan di sekelilingnya.
      const drawSize = size * scale;
      const offset = (size - drawSize) / 2;

      ctx.drawImage(
        img,
        startX, startY, minDim, minDim, // Potong tepat tengah kotak
        offset, offset, drawSize, drawSize // Gambar dengan offset (padding)
      );
    }

    // Perbarui semua canvas di grid
    function renderAllPreviews() {
      if (!currentImage) return;
      renderToCanvas(cvs128, currentImage, currentScale);
      renderToCanvas(cvs48, currentImage, currentScale);
      renderToCanvas(cvs16, currentImage, currentScale);
    }

    // --- Download Trigger ---
    function downloadIcon(size) {
      const cvs = document.getElementById(`cvs-${size}`);
      if (!cvs) return;
      
      const dataUrl = cvs.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadAll() {
      if (!currentImage) return;
      downloadIcon(128);
      setTimeout(() => downloadIcon(48), 250);
      setTimeout(() => downloadIcon(16), 500);
    }

    // --- Reset Workspace ---
    function resetWorkspace() {
      currentImage = null;
      workspace.style.display = 'none';
      dropZone.style.display = 'block';
    }
  </script>
</body>
</html>
