<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRA Icon Resizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --bg-panel: #1e293b;
      --bg-hover: #334155;
      --fg-color: #38bdf8;
      --fg-dim: #94a3b8;
      --fg-highlight: #e2e8f0;
      --accent-blue: #818cf8;
      --font-mono: "Share Tech Mono", "Courier New", Courier, monospace;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--fg-highlight);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: var(--bg-panel);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--fg-dim);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      color: var(--fg-color);
      margin-top: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .drop-zone {
      display: block;
      border: 2px dashed var(--fg-dim);
      border-radius: 8px;
      padding: 2.5rem 1rem;
      margin: 1.5rem 0;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.5);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--fg-color);
      background: var(--bg-hover);
    }

    .drop-zone p {
      margin: 0;
      color: var(--fg-dim);
      font-size: 1.1rem;
      pointer-events: none;
    }

    #preview-container {
      display: none;
      margin-top: 10px;
    }

    #preview-img {
      max-width: 160px;
      max-height: 160px;
      border-radius: 6px;
      border: 1px solid var(--fg-color);
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
    }

    .actions {
      display: none;
      gap: 10px;
      justify-content: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--bg-color);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: var(--accent-blue);
      color: var(--bg-color);
    }

    button.btn-all {
      background: var(--accent-blue);
      color: var(--bg-color);
      width: 100%;
      margin-top: 5px;
    }

    button.btn-all:hover {
      background: var(--fg-highlight);
      border-color: var(--fg-highlight);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>> ICON_RESIZER.exe</h1>
    
    <label class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" style="display: none;">
      <p id="drop-text">Klik di sini untuk Pilih Gambar<br>atau Seret (Drag) File ke Sini</p>
      <div id="preview-container">
        <img id="preview-img" alt="Preview">
      </div>
    </label>

    <div class="actions" id="actions">
      <button onclick="downloadIcon(16)">16x16</button>
      <button onclick="downloadIcon(48)">48x48</button>
      <button onclick="downloadIcon(128)">128x128</button>
      <button class="btn-all" onclick="downloadAll()">DOWNLOAD ALL SIZES (16, 48, 128)</button>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const actions = document.getElementById('actions');
    const dropText = document.getElementById('drop-text');

    let currentImage = null;

    // --- Drag & Drop Events ---
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files && files.length > 0) {
        handleFile(files[0]);
      }
    });

    // --- File Input Change ---
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    // --- File Processing ---
    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Format file tidak valid! Harap unggah file gambar (PNG/JPG).');
        return;
      }

      const reader = new FileReader();
      
      reader.onerror = () => {
        alert('Terjadi kesalahan saat membaca file.');
        fileInput.value = '';
      };

      reader.onload = (event) => {
        const img = new Image();
        img.onerror = () => {
          alert('Gagal memuat data gambar. File mungkin korup.');
          fileInput.value = '';
        };
        img.onload = () => {
          currentImage = img;
          previewImg.src = event.target.result;
          
          dropText.style.display = 'none';
          previewContainer.style.display = 'block';
          actions.style.display = 'flex';
          fileInput.value = '';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- Resizing & Cropping Engine (Optimized for sharpness) ---
    function resizeIcon(size) {
      if (!currentImage) return null;

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Mengoptimalkan kualitas rendering agar tidak terlalu blur di ukuran kecil
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      const { width, height } = currentImage;
      const minDim = Math.min(width, height);
      const startX = (width - minDim) / 2;
      const startY = (height - minDim) / 2;

      ctx.drawImage(
        currentImage,
        startX, startY, minDim, minDim,
        0, 0, size, size
      );

      return canvas.toDataURL('image/png');
    }

    // --- Download Trigger ---
    function downloadIcon(size) {
      const dataUrl = resizeIcon(size);
      if (!dataUrl) return;

      const link = document.createElement('a');
      link.download = `icon-${size}.png`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadAll() {
      if (!currentImage) return;
      downloadIcon(128);
      setTimeout(() => downloadIcon(48), 250);
      setTimeout(() => downloadIcon(16), 500); // Diperbaiki ke ukuran 16 yang benar
    }
  </script>
</body>
</html>
